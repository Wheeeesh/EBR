        /**

         */

        // --- Robust CSV Parser ---
        const parseCSV = (text) => {
          const rows = [];
          let currentRow = [];
          let currentField = '';
          let inQuote = false;
          
          const normalizedText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

          for (let i = 0; i < normalizedText.length; i++) {
            const char = normalizedText[i];
            const nextChar = normalizedText[i + 1];

            if (inQuote) {
              if (char === '"' && nextChar === '"') {
                currentField += '"';
                i++; 
              } else if (char === '"') {
                inQuote = false;
              } else {
                currentField += char;
              }
            } else {
              if (char === '"') {
                inQuote = true;
              } else if (char === ',') {
                currentRow.push(currentField.trim());
                currentField = '';
              } else if (char === '\n') {
                currentRow.push(currentField.trim());
                if (currentRow.length > 0 && (currentRow.length > 1 || currentRow[0] !== '')) {
                    rows.push(currentRow);
                }
                currentRow = [];
                currentField = '';
              } else {
                currentField += char;
              }
            }
          }
          if (currentField || currentRow.length > 0) {
            currentRow.push(currentField.trim());
            rows.push(currentRow);
          }
          return rows;
        };

        // --- Date Formatting for Display ---
        const formatTime = (isoString) => {
          if (!isoString) return '';
          const date = new Date(isoString);
          return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        };

        // --- Date Formatting for CSV Export ---
        const formatDateTimeForExport = (isoString) => {
          if (!isoString) return '';
          const date = new Date(isoString);
          return `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
        };

        // --- Unique ID Generator ---
        const generateId = () => Math.random().toString(36).substr(2, 9) + Date.now().toString(36);

        const Modal = ({ isOpen, onClose, title, children }) => {
          if (!isOpen) return null;
          return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in duration-200">
              <div className="bg-white text-black w-full max-w-md max-h-[90vh] overflow-y-auto rounded-none border-2 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">

        const Button = ({ children, variant = 'primary', onClick, className = '', disabled = false }) => {
          const baseStyle = "font-mono font-bold text-sm px-6 py-4 uppercase transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2";
          const variants = {
            primary: "bg-black text-white border-2 border-black hover:bg-gray-900 shadow-[4px_4px_0px_0px_rgba(250,230,75,1)]",
            secondary: "bg-white text-black border-2 border-black hover:bg-gray-50 shadow-[4px_4px_0px_0px_rgba(15,50,245,1)]",
            danger: "bg-white text-[#E63223] border-2 border-[#E63223] hover:bg-red-50",
            icon: "p-3 border-2 border-black bg-white hover:bg-gray-50"
          };

          return (
            <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
              {children}
            </button>
          );
        };

        const Input = ({ label, value, onChange, placeholder, type = 'text', required = false }) => (
          <div className="mb-4">
            <label className="block font-header text-xs uppercase font-bold tracking-widest mb-2">{label}</label>

              type={type}
              value={value}
              onChange={onChange}
              placeholder={placeholder}
              className="w-full font-mono bg-white border-2 border-black p-3 focus:outline-none focus:ring-4 focus:ring-[#FAE64B]/50 transition-all placeholder:text-gray-400"

            />

        /**
         * ==========================================
         * MAIN APP COMPONENT
         * ==========================================
         */

        function App() {
          // --- STATE ---
          const [events, setEvents] = useState([]);
          const [guests, setGuests] = useState([]);
          const [activeEventId, setActiveEventId] = useState(null);
          const [view, setView] = useState('HOME');

          // UI State
          const [isEventModalOpen, setIsEventModalOpen] = useState(false);
          const [isGuestModalOpen, setIsGuestModalOpen] = useState(false);
          const [isImportModalOpen, setIsImportModalOpen] = useState(false);
          
          // Search & Sort State
          const [searchQuery, setSearchQuery] = useState('');
          const [sortConfig, setSortConfig] = useState({ key: 'lastName', direction: 'asc' });
          const [filterArrived, setFilterArrived] = useState('ALL'); // ALL, ARRIVED, EXPECTED

          // Form State
          const [newEvent, setNewEvent] = useState({ name: '', date: '', location: '', notes: '' });
          const [newGuest, setNewGuest] = useState({ firstName: '', lastName: '', notes: '' });
          const [importFile, setImportFile] = useState(null);
          const [importMapping, setImportMapping] = useState({ first: -1, last: -1 });
          const [parsedPreview, setParsedPreview] = useState([]);

          // --- PERSISTENCE ---
          useEffect(() => {
            const savedEvents = localStorage.getItem('events');
            const savedGuests = localStorage.getItem('guests');
            if (savedEvents) setEvents(JSON.parse(savedEvents));
            if (savedGuests) setGuests(JSON.parse(savedGuests));
          }, []);

          useEffect(() => {
            localStorage.setItem('events', JSON.stringify(events));
          }, [events]);

          useEffect(() => {
            localStorage.setItem('guests', JSON.stringify(guests));
          }, [guests]);

          // --- COMPUTED DATA (MEMOIZED) ---
          const activeEvent = useMemo(() => events.find(e => e.id === activeEventId), [events, activeEventId]);

          const eventGuests = useMemo(() => {
            if (!activeEventId) return [];
            
            let filtered = guests.filter(g => g.eventId === activeEventId);

            // Search
            if (searchQuery) {
              const q = searchQuery.toLowerCase();
              filtered = filtered.filter(g => 
                (g.firstName && g.firstName.toLowerCase().includes(q)) || 
                (g.lastName && g.lastName.toLowerCase().includes(q))
              );
            }

            // Filter - Tabs
            if (filterArrived === 'ARRIVED') {
              filtered = filtered.filter(g => g.arrived);
            } else if (filterArrived === 'EXPECTED') {
              filtered = filtered.filter(g => !g.arrived);
            }

            // Sort
            return filtered.sort((a, b) => {
              const fieldA = (a[sortConfig.key] || '').toString().toLowerCase();
              const fieldB = (b[sortConfig.key] || '').toString().toLowerCase();
              
              if (fieldA < fieldB) return sortConfig.direction === 'asc' ? -1 : 1;
              if (fieldA > fieldB) return sortConfig.direction === 'asc' ? 1 : -1;
              return 0;
            });
          }, [guests, activeEventId, searchQuery, sortConfig, filterArrived]);

          const stats = useMemo(() => {
            const total = guests.filter(g => g.eventId === activeEventId).length;
            const arrived = guests.filter(g => g.eventId === activeEventId && g.arrived).length;
            const percentage = total === 0 ? 0 : Math.round((arrived / total) * 100);
            return { total, arrived, percentage };
          }, [guests, activeEventId]);


          // --- HANDLERS ---

          const handleCreateEvent = (e) => {
            e.preventDefault();
            const event = { ...newEvent, id: generateId(), createdAt: new Date().toISOString() };
            setEvents([...events, event]);
            setNewEvent({ name: '', date: '', location: '', notes: '' });
            setIsEventModalOpen(false);
          };

          const handleAddGuest = (e) => {
            e.preventDefault();
            const guest = {
              ...newGuest,
              id: generateId(),
              eventId: activeEventId,
              arrived: true,
              arrivalTime: new Date().toISOString(),
              source: 'MANUAL'
            };
            setGuests(prev => [...prev, guest]);
            setNewGuest({ firstName: '', lastName: '', notes: '' });
            setIsGuestModalOpen(false);
          };

          const toggleArrived = (guestId) => {
            setGuests(prev => prev.map(g => {
              if (g.id !== guestId) return g;
              const isArriving = !g.arrived;
              return {
                ...g,
                arrived: isArriving,
                arrivalTime: isArriving ? new Date().toISOString() : g.arrivalTime 
              };
            }));
          };

          const handleSort = (key) => {
            setSortConfig(prev => ({
              key,
              direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'
            }));
          };

          // --- CSV LOGIC ---

          const handleFilePreview = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (evt) => {
              const text = evt.target.result;
              const rows = parseCSV(text);
              if (rows.length > 0) {
                setParsedPreview(rows);
                setImportFile(file);
                // Try to auto-detect columns
                const header = rows[0].map(c => c.toLowerCase());
                const firstIdx = header.findIndex(c => c.includes('first') || c.includes('given'));
                const lastIdx = header.findIndex(c => c.includes('last') || c.includes('family') || c.includes('surname'));
                setImportMapping({ 
                    first: firstIdx > -1 ? firstIdx : 0, 
                    last: lastIdx > -1 ? lastIdx : 1 
                });
              }
            };
            reader.readAsText(file);
          };

          const executeImport = () => {
            if (!parsedPreview.length) return;
            const startIndex = 1; 
            
            const newGuests = parsedPreview.slice(startIndex).map(row => {
                const fName = row[importMapping.first] || '';
                const lName = row[importMapping.last] || '';
                if (!fName && !lName) return null;

                return {
                    id: generateId(),
                    eventId: activeEventId,
                    firstName: fName,
                    lastName: lName,
                    arrived: false,
                    arrivalTime: null,
                    source: 'IMPORTED',
                    notes: ''
                };
            }).filter(Boolean);

            // Duplicate strategy
            const existing = guests.filter(g => g.eventId === activeEventId);
            const uniqueNewGuests = newGuests.filter(ng => {
                const isDupe = existing.some(eg => 
                    eg.firstName.toLowerCase() === ng.firstName.toLowerCase() && 
                    eg.lastName.toLowerCase() === ng.lastName.toLowerCase()
                );
                return !isDupe;
            });

            setGuests(prev => [...prev, ...uniqueNewGuests]);
            setIsImportModalOpen(false);
            setParsedPreview([]);
            setImportFile(null);
          };

          const exportCSV = () => {
            const currentGuests = guests.filter(g => g.eventId === activeEventId);
            const headers = ['First Name', 'Last Name', 'Arrived', 'Arrival Time', 'Source', 'Notes'];
            
            const csvContent = [
                headers.join(','),
                ...currentGuests.map(g => {
                    const row = [
                        `"${g.firstName}"`,
                        `"${g.lastName}"`,
                        g.arrived ? 'YES' : 'NO',
                        g.arrived ? formatDateTimeForExport(g.arrivalTime) : '', // Fixed: format time properly
                        g.source,
                        `"${g.notes || ''}"`
                    ];
                    return row.join(',');
                })
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `${activeEvent.name.replace(/\s+/g, '_')}_GuestList.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          // --- RENDER HELPERS ---

          if (view === 'HOME') {
            return (
              <div className="min-h-screen bg-white text-black font-mono flex flex-col">
                {/* Header */}
                <header className="p-6 pb-2 flex flex-col items-center text-center">
                    <div className="w-16 h-20 mb-6">
                        <LogoWhiteBg />
                    </div>
                    <h1 className="font-header text-5xl uppercase italic font-black text-black leading-none mb-2"> Registrations </h1>
                    <BrandDivider />
                </header>

                {/* Event List */}
                <main className="flex-1 px-6 pb-24 overflow-y-auto">
                  {events.length === 0 ? (
                    <div className="text-center py-20 opacity-50">
                      <p className="mb-4">No events yet.</p>
                      <p className="text-xs">Tap "+" to create your first event.</p>
                    </div>
                  ) : (
                    <div className="grid gap-4">
                      {events.map(event => {
                        const eStats = guests.filter(g => g.eventId === event.id);
                        const count = eStats.length;
                        return (
                            <div 
                                key={event.id} 
                                onClick={() => { setActiveEventId(event.id); setView('EVENT'); }}
                                className="border-2 border-black p-4 active:bg-gray-50 transition-colors cursor-pointer shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-y-[-2px] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] transition-all"
                            >
                                <h2 className="font-header text-xl uppercase italic font-black">{event.name}</h2>
                                <div className="flex items-center gap-4 mt-2 text-xs text-gray-600">
                                    {event.date && <span className="flex items-center gap-1"><Calendar size={12}/> {event.date}</span>}
                                    {event.location && <span className="flex items-center gap-1"><MapPin size={12}/> {event.location}</span>}
                                </div>
                                <div className="mt-4 flex items-center justify-between">
                                     <div className="text-xs font-bold uppercase tracking-wider">{count} Guests</div>
                                     <div className="w-8 h-8 rounded-full border-2 border-black flex items-center justify-center hover:bg-black hover:text-white transition-colors">
                                        <MoreHorizontal size={16} />
                                     </div>
                                </div>
                            </div>
                        );
                      })}
                    </div>
                  )}
                </main>

                {/* FAB */}
                <div className="fixed bottom-6 right-6">
                    <button 
                        onClick={() => setIsEventModalOpen(true)}
                        className="w-16 h-16 bg-[#0F32F5] text-white rounded-full border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center active:scale-95 transition-transform"
                    >
                        <Plus size={32} />
                    </button>
                </div>

                <Modal isOpen={isEventModalOpen} onClose={() => setIsEventModalOpen(false)} title="New Event">
                    <form onSubmit={handleCreateEvent}>
                        <Input label="Event Name" value={newEvent.name} onChange={e => setNewEvent({...newEvent, name: e.target.value})} placeholder="E.g. Summer Gala" required />
                        <Input label="Date" type="date" value={newEvent.date} onChange={e => setNewEvent({...newEvent, date: e.target.value})} />
                        <Input label="Location" value={newEvent.location} onChange={e => setNewEvent({...newEvent, location: e.target.value})} placeholder="Venue Name" />
                        <Button type="submit" className="w-full mt-4">Create Event</Button>
                    </form>
                </Modal>
              </div>
            );
          }

          // --- EVENT VIEW ---
          return (
            <div className="min-h-screen bg-white text-black font-mono flex flex-col">
                {/* Progress Bar (Sticky Top) */}
                <div className="sticky top-0 z-30 bg-white border-b-2 border-black shadow-md">
                    <div className="flex items-center justify-between px-4 py-3 bg-white">
                         <button onClick={() => setView('HOME')} className="p-2 -ml-2 hover:bg-gray-100 rounded-full">
                            <ArrowLeft size={24} />
                         </button>
                         <div className="flex-1 mx-4">
                            <div className="flex justify-between text-xs font-bold mb-1 uppercase tracking-wider">
                                <span>{stats.arrived} Arrived</span>
                                <span>{stats.percentage}%</span>
                                <span className="text-gray-500">{stats.total} Total</span>
                            </div>
                            <div className="h-4 w-full bg-gray-100 border-2 border-black relative overflow-hidden">
                                <div 
                                    className="absolute top-0 left-0 h-full bg-[#0F32F5] transition-all duration-500"
                                    style={{ width: `${stats.percentage}%` }}
                                >
                                    <div className="w-full h-full opacity-20" style={{ backgroundImage: 'repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.5) 5px, rgba(255,255,255,0.5) 10px)' }}></div>
                                </div>
                            </div>
                         </div>
                         <button onClick={() => setIsImportModalOpen(true)} className="p-2 hover:bg-gray-100 rounded-full text-[#0F32F5]">
                            <Upload size={24} />
                         </button>
                    </div>
                    
                    {/* Search */}
                    <div className="px-4 pb-2 pt-1 flex gap-2">
                        <div className="relative flex-1">
                            <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={16} />
                            <input 
                                className="w-full pl-10 pr-4 py-3 border-2 border-black font-mono text-sm focus:outline-none focus:ring-2 focus:ring-[#FAE64B]"
                                placeholder="Search guests..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                            />
                        </div>
                        {/* Sort Button */}
                        <button 
                            onClick={() => handleSort('lastName')}
                            className={`px-3 border-2 border-black flex items-center justify-center gap-1 ${sortConfig.key === 'lastName' ? 'bg-black text-white' : 'bg-white'}`}
                        >
                           <span className="font-bold text-xs">A-Z</span>
                           <ArrowUpDown size={14} className={sortConfig.direction === 'asc' ? 'rotate-0 transition-transform' : 'rotate-180 transition-transform'} />
                        </button>
                    </div>

                    {/* Tabs - Replaces the toggle button */}
                    <div className="flex border-b-2 border-black mx-4 mb-2">
                      {['ALL', 'EXPECTED', 'ARRIVED'].map(tab => (
                        <button
                          key={tab}
                          onClick={() => setFilterArrived(tab)}
                          className={`flex-1 py-3 font-bold text-xs uppercase tracking-wider transition-colors border-r-2 last:border-r-0 border-black
                            ${filterArrived === tab ? 'bg-black text-white' : 'bg-white text-black hover:bg-gray-100'}`}
                        >
                          {tab}
                        </button>
                      ))}
                    </div>
                </div>

                {/* Guest List */}
                <main className="flex-1 overflow-y-auto">
                    {eventGuests.length === 0 ? (
                        <div className="flex flex-col items-center justify-center py-20 opacity-50 px-6 text-center">
                            {/* Removed Logo here as requested */}
                            <p className="font-bold">List is empty.</p>
                            <p className="text-sm mt-2">Import a CSV or add walk-ins.</p>
                        </div>
                    ) : (
                        <div className="divide-y divide-gray-200">
                            {eventGuests.slice(0, 500).map((guest) => (
                                <div 
                                    key={guest.id} 
                                    className={`flex items-center p-4 active:bg-gray-50 transition-colors ${guest.arrived ? 'bg-gray-50' : 'bg-white'}`}
                                >
                                    <div className="flex-1 min-w-0 pr-4">
                                        <div className={`font-bold text-lg leading-tight truncate ${guest.arrived ? 'text-gray-400 line-through' : 'text-black'}`}>
                                            {guest.lastName}, {guest.firstName}
                                        </div>
                                        <div className="text-xs text-gray-500 mt-1 flex items-center gap-2">
                                            {guest.source === 'MANUAL' && <span className="bg-[#FAE64B] text-black px-1 text-[10px] font-bold">WALK-IN</span>}
                                            {guest.arrived && <span>Arrived: {formatTime(guest.arrivalTime)}</span>}
                                            {guest.notes && <span className="truncate max-w-[150px] italic">"{guest.notes}"</span>}
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={() => toggleArrived(guest.id)}
                                        className={`w-14 h-14 border-2 border-black rounded-none flex items-center justify-center transition-all active:scale-90
                                            ${guest.arrived ? 'bg-[#0F32F5] border-[#0F32F5]' : 'bg-white hover:bg-gray-100'}
                                        `}
                                    >
                                        {guest.arrived && <Check className="text-white" size={32} strokeWidth={4} />}
                                    </button>
                                </div>
                            ))}
                            {eventGuests.length > 500 && (
                                <div className="p-4 text-center text-sm text-gray-500 italic border-t border-gray-200">
                                    Showing first 500 of {eventGuests.length} results. Use search to find specific guests.
                                </div>
                            )}
                        </div>
                    )}
                </main>

                {/* Footer Actions - Walk-in button more prominent */}
                <div className="p-4 border-t-2 border-black bg-white flex gap-4 sticky bottom-0 z-40">
                     <Button variant="secondary" className="flex-[2] shadow-[4px_4px_0px_0px_rgba(15,50,245,1)]" onClick={() => setIsGuestModalOpen(true)}>
                        <UserPlus size={18} /> Walk-In
                     </Button>
                     <button 
                        onClick={exportCSV}
                        className="flex-1 border-2 border-black bg-white hover:bg-gray-50 flex items-center justify-center shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-x-[4px] active:translate-y-[4px] transition-all"
                        title="Export CSV"
                     >
                        <Download size={24} />
                     </button>
                </div>

                {/* Add Walk-in Modal */}
                <Modal isOpen={isGuestModalOpen} onClose={() => setIsGuestModalOpen(false)} title="Add Walk-In">
                    <form onSubmit={handleAddGuest}>
                        <div className="flex gap-4">
                            <div className="flex-1">
                                <Input label="First Name" value={newGuest.firstName} onChange={e => setNewGuest({...newGuest, firstName: e.target.value})} required />
                            </div>
                            <div className="flex-1">
                                <Input label="Last Name" value={newGuest.lastName} onChange={e => setNewGuest({...newGuest, lastName: e.target.value})} required />
                            </div>
                        </div>
                        <Input label="Notes (Optional)" value={newGuest.notes} onChange={e => setNewGuest({...newGuest, notes: e.target.value})} />
                        <div className="bg-[#FAE64B]/20 p-4 mb-4 border-l-4 border-[#FAE64B] text-xs">
                            Walk-ins are automatically marked as <strong>Arrived</strong> upon creation.
                        </div>
                        <Button type="submit" className="w-full">Check In Guest</Button>
                    </form>
                </Modal>

                {/* Import CSV Modal */}
                <Modal isOpen={isImportModalOpen} onClose={() => setIsImportModalOpen(false)} title="Import Guest List">
                    {!importFile ? (
                        <div className="text-center py-8 border-2 border-dashed border-gray-300 rounded-lg bg-gray-50">
                            <Upload className="mx-auto text-gray-400 mb-4" size={48} />
                            <p className="font-bold mb-2">Select a CSV File</p>
                            <p className="text-xs text-gray-500 mb-6 px-8">Ensure your file has headers for First Name and Last Name.</p>
                            <input 
                                type="file" 
                                accept=".csv"
                                id="csvInput"
                                className="hidden"
                                onChange={handleFilePreview}
                            />
                            <label htmlFor="csvInput">
                                <span className="cursor-pointer bg-black text-white px-6 py-3 font-bold font-mono text-sm border-2 border-black hover:bg-gray-800 shadow-[4px_4px_0px_0px_rgba(15,50,245,1)]">
                                    Browse Files
                                </span>
                            </label>
                        </div>
                    ) : (
                        <div>
                            <div className="flex items-center gap-2 mb-6 p-2 bg-gray-100 border border-gray-300">
                                <FileText size={16} />
                                <span className="text-xs truncate flex-1 font-bold">{importFile.name}</span>
                                <button onClick={() => { setImportFile(null); setParsedPreview([]); }} className="text-red-500"><X size={16} /></button>
                            </div>

                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <div>
                                    <label className="block text-xs font-bold mb-1">First Name Column</label>
                                    <select 
                                        className="w-full p-2 border-2 border-black font-mono text-sm bg-white"
                                        value={importMapping.first}
                                        onChange={e => setImportMapping({...importMapping, first: parseInt(e.target.value)})}
                                    >
                                        {parsedPreview[0]?.map((col, i) => (
                                            <option key={i} value={i}>{col || `Column ${i+1}`}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold mb-1">Last Name Column</label>
                                    <select 
                                        className="w-full p-2 border-2 border-black font-mono text-sm bg-white"
                                        value={importMapping.last}
                                        onChange={e => setImportMapping({...importMapping, last: parseInt(e.target.value)})}
                                    >
                                        {parsedPreview[0]?.map((col, i) => (
                                            <option key={i} value={i}>{col || `Column ${i+1}`}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div className="mb-6 max-h-40 overflow-y-auto border border-gray-200">
                                <table className="w-full text-xs text-left">
                                    <thead className="bg-gray-50 border-b">
                                        <tr>
                                            <th className="p-2">First Name (Preview)</th>
                                            <th className="p-2">Last Name (Preview)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {parsedPreview.slice(1, 6).map((row, i) => (
                                            <tr key={i} className="border-b">
                                                <td className="p-2">{row[importMapping.first]}</td>
                                                <td className="p-2">{row[importMapping.last]}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <div className="p-2 text-center text-xs text-gray-500">
                                    + {parsedPreview.length - 6} more rows
                                </div>
                            </div>

                            <Button onClick={executeImport} className="w-full">
                                Import {parsedPreview.length - 1} Guests
                            </Button>
                        </div>
                    )}
                </Modal>
            </div>
          );
        }

        // Mount the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
